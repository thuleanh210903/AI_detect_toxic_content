<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>AI Toxic Detector</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <h2>AI Toxic Detector</h2>
      <textarea id="textInput" placeholder="Đang quét trang..."></textarea>

      </div>

      <button id="analyzeBtn">Analyze</button>

      <div id="result" class="result"></div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
